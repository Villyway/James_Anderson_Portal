<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Do Not Mail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 2rem;
        }
        .table thead {
            background: #007bff;
            color: white;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .manage-do-not-mail {
            color: #6f42c1;
            text-decoration: none;
            margin-left: 0.5rem;
        }
        .manage-do-not-mail:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h5>Search:</h5>
        <form method="GET">
            <div class="mb-3">
                <input type="text" class="form-control" name="search" placeholder="" value="{{ search_query }}">
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
            <a href="{% url 'manage_do_not_mail' %}" class="btn btn-secondary">Reset</a>
            <button type="button" class="btn btn-secondary">Mark (DoNotMail)</button>
            <a href="{% url 'dashboard' %}" class="manage-do-not-mail">Back to Main Page</a>
        </form>

        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Region</th>
                    <th>Name</th>
                    <th>Owner</th>
                    <th>Address</th>
                    <th>City</th>
                    <th>State</th>
                    <th>
                        <input type="checkbox" id="select-all"> Select ALL
                    </th>
                </tr>
            </thead>
            <tbody>
                {% for county in counties %}
                <tr>
                    <td>{{ county.name }}</td>
                    <td>{{ county.name }}</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>
                        <input type="checkbox" name="select_{{ county.id }}">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Select All checkbox functionality
        document.getElementById('select-all').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][name^="select_"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
        });
    </script>
</body>
</html>
